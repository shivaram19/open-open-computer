version: "3.8"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./outputs:/app/outputs
      - ./assets:/app/assets

  worker:
    build: .
    command: ["python3", "-m", "src.worker"]
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    volumes:
      - ./outputs:/app/outputs
      - ./assets:/app/assets
    deploy:
      replicas: 1

volumes:
  redis_data:
